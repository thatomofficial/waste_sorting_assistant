name: Branch Protection Setup

on:
  workflow_dispatch:

jobs:
  setup-branch-protection:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Setup branch protection rules
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;

          try {
            // Set up branch protection for main branch
            await github.rest.repos.updateBranchProtection({
              owner,
              repo,
              branch: 'main',
              required_status_checks: {
                strict: true,
                contexts: [
                  'Code Quality Checks',
                  'Run Tests',
                  'Build Android APK',
                  'Build iOS (No Code Signing)',
                  'Security Vulnerability Scan',
                  'Performance and Size Analysis'
                ]
              },
              enforce_admins: false,
              required_pull_request_reviews: {
                required_approving_review_count: 1,
                dismiss_stale_reviews: true,
                require_code_owner_reviews: false,
                require_last_push_approval: true
              },
              restrictions: null,
              allow_force_pushes: false,
              allow_deletions: false,
              block_creations: false,
              required_conversation_resolution: true
            });

            console.log('✅ Branch protection rules updated for main branch');

            // Set up branch protection for dev branch (if it exists)
            try {
              await github.rest.repos.updateBranchProtection({
                owner,
                repo,
                branch: 'dev',
                required_status_checks: {
                  strict: true,
                  contexts: [
                    'Code Quality Checks',
                    'Run Tests',
                    'Build Android APK'
                  ]
                },
                enforce_admins: false,
                required_pull_request_reviews: {
                  required_approving_review_count: 1,
                  dismiss_stale_reviews: true,
                  require_code_owner_reviews: false
                },
                restrictions: null,
                allow_force_pushes: false,
                allow_deletions: false
              });
              console.log('✅ Branch protection rules updated for dev branch');
            } catch (error) {
              console.log('⚠️ Could not set protection for dev branch (may not exist):', error.message);
            }

          } catch (error) {
            console.error('❌ Failed to set branch protection:', error);
            process.exit(1);
          }